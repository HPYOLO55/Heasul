kind = "web"
previewPath = "/"
title = "GlowUp AI"
version = "1.0.0"
id = "artifacts/glowup-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22220

[services.development]
run = "pnpm --filter @workspace/glowup-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/glowup-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/glowup-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22220"
BASE_PATH = "/"
